name: Dockerhub Continuous Deployment

on:
  push:
    branches: [ dockercd ]

jobs:
  push_dockerhub:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build -f demo/Dockerfile -t ${{ secrets.DOCKERHUB_USER }}/dockercd:latest demo

      - name: Push Docker image
        run: docker push ${{ secrets.DOCKERHUB_USER }}/dockercd:latest
