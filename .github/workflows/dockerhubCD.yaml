name: Dockerhub Continuous Deployment

on:
  push:

jobs:
  push_dockerhub:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set commit SHA tag
        id: vars
        run: echo "COMMIT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Build Docker image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/dockercd:${{ env.COMMIT_SHA }} \
                       -t ${{ secrets.DOCKERHUB_USERNAME }}/dockercd:latest .

      - name: Push Docker image
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/dockercd:${{ env.COMMIT_SHA }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/dockercd:latest
